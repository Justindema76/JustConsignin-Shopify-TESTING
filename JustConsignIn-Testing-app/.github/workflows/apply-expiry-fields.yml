name: Apply expiry metaobject fields

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Apply targeted expiry changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('app/metaobjects.server.js')
          text = path.read_text()
          old = '      { key: "date_received", name: "Date Received", type: "date" },\n      { key: "category", name: "Category", type: "single_line_text_field" },'
          new = '      { key: "date_received", name: "Date Received", type: "date" },\n      { key: "consignment_term", name: "Consignment Term", type: "single_line_text_field" },\n      { key: "expiry_date", name: "Expiry Date", type: "date" },\n      { key: "expiry_action", name: "Expiry Action", type: "single_line_text_field" },\n      { key: "category", name: "Category", type: "single_line_text_field" },'
          text = replace_once(text, old, new, 'metaobjects fields')
          path.write_text(text)

          path = Path('app/routes/api.consignment.jsx')
          text = path.read_text()

          old = "  { key: 'date_received', name: 'Date Received', type: 'date' },\n  { key: 'category', name: 'Category', type: 'single_line_text_field' },"
          new = "  { key: 'date_received', name: 'Date Received', type: 'date' },\n  { key: 'consignment_term', name: 'Consignment Term', type: 'single_line_text_field' },\n  { key: 'expiry_date', name: 'Expiry Date', type: 'date' },\n  { key: 'expiry_action', name: 'Expiry Action', type: 'single_line_text_field' },\n  { key: 'category', name: 'Category', type: 'single_line_text_field' },"
          text = replace_once(text, old, new, 'api definition fields')

          old = "    dateReceived: field.date_received || '',\n    category: field.category || '',"
          new = "    dateReceived: field.date_received || '',\n    consignmentTerm: field.consignment_term || '',\n    expiryDate: field.expiry_date || '',\n    expiryAction: field.expiry_action || '',\n    category: field.category || '',"
          text = replace_once(text, old, new, 'api item mapping')

          old = "function today() {\n  return new Date().toISOString().slice(0, 10);\n}\n"
          new = "function today() {\n  return new Date().toISOString().slice(0, 10);\n}\n\nfunction calculateExpiryDate(receivedDate, term) {\n  if (!receivedDate || !term || term === 'none') return null;\n  const days = Number(term);\n  if (!Number.isFinite(days) || days <= 0) return null;\n  const date = new Date(`${receivedDate}T00:00:00Z`);\n  if (Number.isNaN(date.getTime())) return null;\n  date.setUTCDate(date.getUTCDate() + days);\n  return date.toISOString().slice(0, 10);\n}\n"
          text = replace_once(text, old, new, 'api expiry helper')

          old = "    field('date_received', value.dateReceived),\n    field('category', value.category),"
          new = "    field('date_received', value.dateReceived),\n    field('consignment_term', value.consignmentTerm),\n    field('expiry_date', value.expiryDate),\n    field('expiry_action', value.expiryAction),\n    field('category', value.category),"
          text = replace_once(text, old, new, 'api itemFields expiry mapping')

          old = "        let saved = await upsert(admin, 'consignment_item', itemNumber, [\n          field('item_number', itemNumber),\n          field('consignor', consignor.id),\n          field('date_received', today()),\n          field('category', input.category),"
          new = "        const dateReceived = input.dateReceived || today();\n        const consignmentTerm = input.consignmentTerm || '';\n        const expiryDate = calculateExpiryDate(dateReceived, consignmentTerm);\n        let saved = await upsert(admin, 'consignment_item', itemNumber, [\n          field('item_number', itemNumber),\n          field('consignor', consignor.id),\n          field('date_received', dateReceived),\n          field('consignment_term', consignmentTerm),\n          field('expiry_date', expiryDate),\n          field('expiry_action', input.expiryAction || ''),\n          field('category', input.category),"
          text = replace_once(text, old, new, 'api create item expiry fields')

          old = "        itemFields(existing, {\n          category: input.category,\n          description: input.description?.trim(),"
          new = "        itemFields(existing, {\n          dateReceived: input.dateReceived || existing.dateReceived || today(),\n          consignmentTerm: input.consignmentTerm || '',\n          expiryDate: calculateExpiryDate(input.dateReceived || existing.dateReceived || today(), input.consignmentTerm || ''),\n          expiryAction: input.expiryAction || '',\n          category: input.category,\n          description: input.description?.trim(),"
          text = replace_once(text, old, new, 'api update item expiry fields')
          path.write_text(text)

          path = Path('app/consignment_intake.jsx')
          text = path.read_text()

          old = "const CONDITIONS = ['New with tags', 'Like new', 'Good', 'Fair'];\nconst money = (n) => `$${Number(n || 0).toFixed(2)}`;"
          new = "const CONDITIONS = ['New with tags', 'Like new', 'Good', 'Fair'];\nconst CONSIGNMENT_TERMS = [\n  { value: '', label: 'No term tracking' },\n  { value: '30', label: '30 days' },\n  { value: '60', label: '60 days' },\n  { value: '90', label: '90 days' },\n  { value: '120', label: '120 days' },\n  { value: 'none', label: 'No Expiry' },\n];\nconst EXPIRY_ACTIONS = ['', 'Return to Consignor', 'Extend', 'Reduce Price', 'Donate'];\nconst currentDate = () => new Date().toISOString().slice(0, 10);\nfunction calculateExpiryDate(receivedDate, term) {\n  if (!receivedDate || !term || term === 'none') return '';\n  const days = Number(term);\n  if (!Number.isFinite(days) || days <= 0) return '';\n  const date = new Date(`${receivedDate}T00:00:00Z`);\n  if (Number.isNaN(date.getTime())) return '';\n  date.setUTCDate(date.getUTCDate() + days);\n  return date.toISOString().slice(0, 10);\n}\nconst money = (n) => `$${Number(n || 0).toFixed(2)}`;"
          text = replace_once(text, old, new, 'ui expiry constants')

          manual_start = text.index('function ManualItemCore({')
          manual_end = text.index('\nfunction productAdminUrl(', manual_start)
          before = text[:manual_start]
          manual = text[manual_start:manual_end]
          after = text[manual_end:]

          old = "  const set = (key) => (event) => setForm((current) => ({ ...current, [key]: event.target.value }));\n  const setCategory = (category) => setForm((current) => ({ ...current, category, type: '' }));\n\n  return ("
          new = "  const set = (key) => (event) => setForm((current) => ({ ...current, [key]: event.target.value }));\n  const setCategory = (category) => setForm((current) => ({ ...current, category, type: '' }));\n  const setReceivedDate = (event) => {\n    const dateReceived = event.target.value;\n    setForm((current) => ({\n      ...current,\n      dateReceived,\n      expiryDate: calculateExpiryDate(dateReceived, current.consignmentTerm),\n    }));\n  };\n  const setConsignmentTerm = (event) => {\n    const consignmentTerm = event.target.value;\n    setForm((current) => ({\n      ...current,\n      consignmentTerm,\n      expiryDate: calculateExpiryDate(current.dateReceived, consignmentTerm),\n    }));\n  };\n\n  return ("
          manual = replace_once(manual, old, new, 'ui manual expiry handlers')

          old = "        <div className=\"consignment-field\">\n          <label className=\"consignment-label\">Condition</label>\n          <select className=\"consignment-select\" value={form.condition} onChange={set('condition')}>\n            {CONDITIONS.map((condition) => <option key={condition} value={condition}>{condition}</option>)}\n          </select>\n        </div>\n        <div className=\"consignment-field wide\">\n          <label className=\"consignment-label\">Internal notes</label>"
          new = "        <div className=\"consignment-field\">\n          <label className=\"consignment-label\">Condition</label>\n          <select className=\"consignment-select\" value={form.condition} onChange={set('condition')}>\n            {CONDITIONS.map((condition) => <option key={condition} value={condition}>{condition}</option>)}\n          </select>\n        </div>\n        <div className=\"consignment-field wide\" style={{ borderTop: '1px solid var(--line)', paddingTop: 14 }}>\n          <label className=\"consignment-label\">Consignment term &amp; expiry</label>\n        </div>\n        <div className=\"consignment-field\">\n          <label className=\"consignment-label\">Received date</label>\n          <input className=\"consignment-input\" type=\"date\" value={form.dateReceived || ''} onChange={setReceivedDate} />\n        </div>\n        <div className=\"consignment-field\">\n          <label className=\"consignment-label\">Consignment term</label>\n          <select className=\"consignment-select\" value={form.consignmentTerm || ''} onChange={setConsignmentTerm}>\n            {CONSIGNMENT_TERMS.map((term) => <option key={term.value || 'blank'} value={term.value}>{term.label}</option>)}\n          </select>\n        </div>\n        <div className=\"consignment-field\">\n          <label className=\"consignment-label\">Expiry date</label>\n          <input className=\"consignment-input\" type=\"date\" value={form.expiryDate || ''} readOnly />\n        </div>\n        <div className=\"consignment-field\">\n          <label className=\"consignment-label\">Expiry action</label>\n          <select className=\"consignment-select\" value={form.expiryAction || ''} onChange={set('expiryAction')}>\n            {EXPIRY_ACTIONS.map((action) => <option key={action || 'blank'} value={action}>{action || 'No action selected'}</option>)}\n          </select>\n        </div>\n        <div className=\"consignment-field wide\">\n          <label className=\"consignment-label\">Internal notes</label>"
          manual = replace_once(manual, old, new, 'ui manual expiry fields')
          text = before + manual + after

          old = "  const emptyForm = {\n    category: 'Clothing', type: '', description: '', size: '', condition: 'Good',\n    price: '', brand: '', notes: '',\n  };"
          new = "  const emptyForm = {\n    category: 'Clothing', type: '', description: '', size: '', condition: 'Good',\n    price: '', brand: '', notes: '', dateReceived: currentDate(),\n    consignmentTerm: '', expiryDate: '', expiryAction: '',\n  };"
          text = replace_once(text, old, new, 'ui intake defaults')

          old = "    size: item.size || '', condition: item.condition || 'Good', price: item.price ?? '',\n    brand: item.brand || '', notes: item.notes || '',\n  });"
          new = "    size: item.size || '', condition: item.condition || 'Good', price: item.price ?? '',\n    brand: item.brand || '', notes: item.notes || '',\n    dateReceived: item.dateReceived || currentDate(),\n    consignmentTerm: item.consignmentTerm || '',\n    expiryDate: item.expiryDate || calculateExpiryDate(item.dateReceived || currentDate(), item.consignmentTerm || ''),\n    expiryAction: item.expiryAction || '',\n  });"
          text = replace_once(text, old, new, 'ui edit defaults')
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit only verified app changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-expiry-fields.yml
          git add app/metaobjects.server.js app/routes/api.consignment.jsx app/consignment_intake.jsx
          git diff --cached --check
          git commit -m "Add consignment expiry metaobject fields"
          git push origin HEAD:main
