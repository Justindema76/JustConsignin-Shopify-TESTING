name: Apply social post panel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-social-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject isolated social component
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('JustConsignIn-Testing-app/app/consignment_intake.jsx')
          text = path.read_text()

          import_line = "import SocialPostPanel from './components/social/SocialPostPanel';\n"
          import_anchor = "import ConsignmentFilterBar from './components/consignment/ConsignmentFilterBar';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Social import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          css_line = "import './styles/social-media.css';\n"
          css_anchor = "import './styles/shopify-file-picker.css';\n"
          if css_line not in text:
              if css_anchor not in text:
                  raise SystemExit('Social CSS anchor not found')
              text = text.replace(css_anchor, css_anchor + css_line, 1)

          panel = "          <SocialPostPanel item={item} disabled={isSold} />\n\n"
          delete_anchor = "          {!confirmingDelete ? (\n"
          if panel not in text:
              if delete_anchor not in text:
                  raise SystemExit('Edit Item insertion anchor not found')
              text = text.replace(delete_anchor, panel + delete_anchor, 1)

          path.write_text(text)
          PY

      - name: Commit social panel injection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JustConsignIn-Testing-app/app/consignment_intake.jsx
          if git diff --cached --quiet; then
            echo "Social panel already injected."
            exit 0
          fi
          git commit -m "Inject social post panel into Edit Item"
          git push origin HEAD:main
