name: Apply full Shopify import

on:
  push:
    paths:
      - '.github/workflows/apply-full-shopify-import.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Apply import changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # ---------------- API import backend ----------------
          path = Path('app/routes/api.consignment.jsx')
          text = path.read_text()

          old = """      const optionalNumber = (value) => {
        if (text(value) === '') return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      };

      // The combined consignor import creates/matches the consignor first, then
      // attaches every manual item using the returned metaobject ID. It never
      // relies on a CSV consignor number and never creates Shopify products.
"""
          new = """      const optionalNumber = (value) => {
        if (text(value) === '') return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      };
      const parseTags = (value) => text(value)
        .split(/[|,]/)
        .map((tag) => tag.trim())
        .filter(Boolean);
      const shopifyImportFields = (row, description, price) => {
        const createShopifyProduct = asBoolean(
          row.create_shopify_product ?? row.createShopifyProduct ?? row.shopify_product ?? row.shopifyProduct,
        );
        const requestedShopifyPrice = optionalNumber(row.shopify_price ?? row.shopifyPrice);
        const publishToPosRaw = text(row.publish_to_pos ?? row.publishToPos);
        return {
          createShopifyProduct,
          shopifyTitle: text(row.shopify_title || row.shopifyTitle) || (createShopifyProduct ? description : ''),
          shopifyPrice: requestedShopifyPrice ?? (createShopifyProduct ? price : null),
          productDescription: text(row.shopify_description || row.product_description || row.productDescription),
          vendor: text(row.shopify_vendor || row.vendor),
          tags: parseTags(row.shopify_tags || row.tags),
          shopifyCategoryId: text(row.shopify_category_id || row.shopifyCategoryId),
          shopifyCategoryName: text(row.shopify_category_name || row.shopifyCategoryName),
          seoTitle: text(row.seo_title || row.seoTitle),
          seoDescription: text(row.seo_description || row.seoDescription),
          publishToPos: createShopifyProduct && (publishToPosRaw === '' ? true : asBoolean(publishToPosRaw)),
          publishOnline: createShopifyProduct && asBoolean(row.publish_online ?? row.publishOnline),
        };
      };
      let tier2VerifiedForImport = false;
      const ensureImportTier2 = async () => {
        if (!tier2VerifiedForImport) {
          await requireTier2(admin);
          tier2VerifiedForImport = true;
        }
      };
      const persistImportedItem = async ({ value, consignor, rowNumber }) => {
        let saved = null;
        let product = null;
        try {
          saved = await upsert(admin, 'consignment_item', safeHandle(value.itemNumber), itemFields(value));
          if (value.createShopifyProduct) {
            if (value.status === 'Sold' || value.paidOut) {
              throw new Error(`Row ${rowNumber}: a sold/paid item cannot be created as an active Shopify product.`);
            }
            if (!value.shopifyTitle) {
              throw new Error(`Row ${rowNumber}: shopify_title is required when create_shopify_product is true.`);
            }
            const sellPrice = Number(value.shopifyPrice ?? value.price);
            if (!Number.isFinite(sellPrice) || sellPrice <= 0) {
              throw new Error(`Row ${rowNumber}: shopify_price must be greater than 0 when create_shopify_product is true.`);
            }
            value.shopifyPrice = sellPrice;
            await ensureImportTier2();
            product = await syncPosProduct(admin, value, consignor, current.shop?.name);
            value.shopifyProductId = product.id;
            value.status = 'Available';
            saved = await upsert(admin, 'consignment_item', safeHandle(value.itemNumber), itemFields(value));
          }
          return { saved, product };
        } catch (error) {
          if (product?.id) {
            try {
              await adminGraphql(admin, PRODUCT_DELETE_MUTATION, { input: { id: product.id } });
            } catch (cleanupError) {
              console.error('Could not clean up imported Shopify product after import failure', cleanupError);
            }
          }
          if (saved?.id) {
            try {
              await remove(admin, saved.id);
            } catch (cleanupError) {
              console.error('Could not clean up imported consignment item after import failure', cleanupError);
            }
          }
          throw error;
        }
      };

      // The combined import creates/matches the consignor first, then attaches
      // each item. Rows can stay manual or create a Shopify POS/Online product
      // using the exact same syncPosProduct() path as the normal item workflow.
"""
          text = replace_once(text, old, new, 'import helpers')

          old = """        let itemsImported = 0;
        let itemsSkipped = 0;
"""
          new = """        let itemsImported = 0;
        let itemsSkipped = 0;
        let shopifyProductsCreated = 0;
"""
          text = replace_once(text, old, new, 'combined import counters')

          old = """            const salePrice = optionalNumber(row.sale_price ?? row.salePrice);
            const commissionPct = Number(row.commission_pct || row.commissionPct || consignor.commissionPct || 50);
            const payoutAmount = sold ? ((salePrice ?? price) * commissionPct) / 100 : 0;
            const value = {
              itemNumber,
              consignorId: consignor.id,
              dateReceived: text(row.date_received || row.dateReceived) || today(),
              category: text(row.category),
              type: '',
              description,
              size: text(row.size),
              condition: text(row.condition) || 'Good',
              price,
              commissionPct,
              status,
              brand: text(row.brand),
              notes: text(row.item_notes || row.notes),
              importKey: itemImportKey,
              tags: [], vendor: '', productDescription: '', shopifyTitle: '',
              salePrice: sold ? (salePrice ?? price) : null,
              dateSold: sold ? (text(row.sale_date || row.date_sold || row.dateSold) || today()) : null,
              orderName: null, orderId: null,
              paidOut,
              payoutId: paidOut ? `imported-${itemNumber}` : '',
              payoutDate: paidOut ? (text(row.payout_date || row.payoutDate) || today()) : '',
              payoutMethod: paidOut ? (text(row.payout_method || row.payoutMethod) || 'Imported payment') : '',
              payoutReference: '', payoutNote: '', payoutAmount,
              payoutTotal: payoutAmount, payoutAdjustment: 0,
            };
            await upsert(admin, 'consignment_item', safeHandle(itemNumber), itemFields(value));
            itemsImported += 1;
"""
          new = """            const salePrice = optionalNumber(row.sale_price ?? row.salePrice);
            const commissionPct = Number(row.commission_pct || row.commissionPct || consignor.commissionPct || 50);
            const payoutAmount = sold ? ((salePrice ?? price) * commissionPct) / 100 : 0;
            const dateReceived = text(row.date_received || row.dateReceived) || today();
            const consignmentTerm = text(row.consignment_term || row.consignmentTerm);
            const shopifyFields = shopifyImportFields(row, description, price);
            const value = {
              itemNumber,
              consignorId: consignor.id,
              dateReceived,
              consignmentTerm,
              expiryDate: text(row.expiry_date || row.expiryDate) || calculateExpiryDate(dateReceived, consignmentTerm),
              expiryAction: text(row.expiry_action || row.expiryAction),
              category: text(row.category),
              type: text(row.item_type || row.type),
              description,
              size: text(row.size),
              condition: text(row.condition) || 'Good',
              price,
              commissionPct,
              status,
              brand: text(row.brand),
              notes: text(row.item_notes || row.notes),
              importKey: itemImportKey,
              ...shopifyFields,
              salePrice: sold ? (salePrice ?? price) : null,
              dateSold: sold ? (text(row.sale_date || row.date_sold || row.dateSold) || today()) : null,
              orderName: null, orderId: null,
              paidOut,
              payoutId: paidOut ? `imported-${itemNumber}` : '',
              payoutDate: paidOut ? (text(row.payout_date || row.payoutDate) || today()) : '',
              payoutMethod: paidOut ? (text(row.payout_method || row.payoutMethod) || 'Imported payment') : '',
              payoutReference: '', payoutNote: '', payoutAmount,
              payoutTotal: payoutAmount, payoutAdjustment: 0,
            };
            const imported = await persistImportedItem({ value, consignor, rowNumber: entry.index + 2 });
            if (imported.product) shopifyProductsCreated += 1;
            itemsImported += 1;
"""
          text = replace_once(text, old, new, 'combined item import')

          old = """          itemsImported,
          itemsSkipped,
        });
"""
          new = """          itemsImported,
          itemsSkipped,
          shopifyProductsCreated,
        });
"""
          text = replace_once(text, old, new, 'combined response')

          old = """      let itemsImported = 0;
      for (const [index, row] of rows.entries()) {
"""
          new = """      let itemsImported = 0;
      let shopifyProductsCreated = 0;
      for (const [index, row] of rows.entries()) {
"""
          text = replace_once(text, old, new, 'item-only counters')

          old = """        const status = text(row.status || 'Available');
        const sold = status === 'Sold' || Boolean(text(row.sale_date || row.date_sold));
        const paidOut = text(row.payout_status).toLowerCase() === 'paid';
        await upsert(admin, 'consignment_item', safeHandle(itemNumber), itemFields({
          itemNumber, consignorId: consignor.id, dateReceived: text(row.date_received) || today(),
          category: text(row.category), type: '', description, size: text(row.size),
          condition: text(row.condition) || 'Good', price,
          commissionPct: Number(row.commission_pct || consignor.commissionPct || 50),
          status: sold ? 'Sold' : status, brand: text(row.brand), notes: text(row.item_notes || row.notes),
          importKey: itemImportKey, tags: [], vendor: '', productDescription: '', shopifyTitle: '',
          salePrice: sold ? (optionalNumber(row.sale_price) ?? price) : null,
          dateSold: sold ? (text(row.sale_date || row.date_sold) || today()) : null,
          paidOut, payoutId: paidOut ? `imported-${itemNumber}` : '', payoutDate: paidOut ? today() : '',
          payoutMethod: paidOut ? 'Imported payment' : '', payoutAmount: 0, payoutTotal: 0, payoutAdjustment: 0,
        }));
        itemsImported += 1;
      }
      return Response.json({ imported: itemsImported, itemsImported });
"""
          new = """        const status = text(row.status || 'Available');
        const sold = status === 'Sold' || Boolean(text(row.sale_date || row.date_sold));
        const paidOut = text(row.payout_status).toLowerCase() === 'paid';
        const dateReceived = text(row.date_received || row.dateReceived) || today();
        const consignmentTerm = text(row.consignment_term || row.consignmentTerm);
        const shopifyFields = shopifyImportFields(row, description, price);
        const value = {
          itemNumber, consignorId: consignor.id, dateReceived,
          consignmentTerm,
          expiryDate: text(row.expiry_date || row.expiryDate) || calculateExpiryDate(dateReceived, consignmentTerm),
          expiryAction: text(row.expiry_action || row.expiryAction),
          category: text(row.category), type: text(row.item_type || row.type), description, size: text(row.size),
          condition: text(row.condition) || 'Good', price,
          commissionPct: Number(row.commission_pct || consignor.commissionPct || 50),
          status: sold ? 'Sold' : status, brand: text(row.brand), notes: text(row.item_notes || row.notes),
          importKey: itemImportKey, ...shopifyFields,
          salePrice: sold ? (optionalNumber(row.sale_price) ?? price) : null,
          dateSold: sold ? (text(row.sale_date || row.date_sold) || today()) : null,
          paidOut, payoutId: paidOut ? `imported-${itemNumber}` : '', payoutDate: paidOut ? today() : '',
          payoutMethod: paidOut ? 'Imported payment' : '', payoutAmount: 0, payoutTotal: 0, payoutAdjustment: 0,
        };
        const imported = await persistImportedItem({ value, consignor, rowNumber: index + 2 });
        if (imported.product) shopifyProductsCreated += 1;
        itemsImported += 1;
      }
      return Response.json({ imported: itemsImported, itemsImported, shopifyProductsCreated });
"""
          text = replace_once(text, old, new, 'item-only import')
          path.write_text(text)

          # ---------------- Intake import templates/UI ----------------
          path = Path('app/consignment_intake.jsx')
          text = path.read_text()

          old = """      if (kind === 'consignors') {
        flash(`${result.consignorsCreated || 0} created, ${result.consignorsUpdated || 0} matched/updated, ${result.itemsImported || 0} items imported`);
      } else {
        flash(`${result.itemsImported ?? result.imported} item${(result.itemsImported ?? result.imported) === 1 ? '' : 's'} imported`);
      }
"""
          new = """      if (kind === 'consignors') {
        flash(`${result.consignorsCreated || 0} created, ${result.consignorsUpdated || 0} matched/updated, ${result.itemsImported || 0} items imported, ${result.shopifyProductsCreated || 0} Shopify products created`);
      } else {
        const importedCount = result.itemsImported ?? result.imported;
        flash(`${importedCount} item${importedCount === 1 ? '' : 's'} imported, ${result.shopifyProductsCreated || 0} Shopify products created`);
      }
"""
          text = replace_once(text, old, new, 'import result message')

          old = """  const required = isConsignors
    ? 'consignor_import_key, first_name, last_name; item_description and price when the row contains an item'
    : fixedConsignor ? 'item_description, price' : 'consignor_import_key (or email/phone), item_description, price';
  const templateConsignorNumber = fixedConsignor?.number || 1;
  const template = isConsignors
    ? 'consignor_import_key,first_name,last_name,phone,email,address,city,province,postal_code,date_joined,commission_pct,unsold_preference,consignor_notes,item_import_key,item_description,price,category,brand,size,condition,item_notes,status,sale_price,sale_date,payout_status\\njane-smith-9055550100,Jane,Smith,905-555-0100,jane@example.com,123 Main Street,Hamilton,Ontario,L8E 1A1,2026-07-30,50,Please return,,jane-001,Blue winter coat,45.00,Clothing,Gap,Medium,Like new,,Available,,,'
    : fixedConsignor
      ? `item_import_key,item_description,price,category,brand,size,condition,item_notes,status,sale_price,sale_date,payout_status,consignor_number\\nitem-001,Blue baby sweater,18.00,Clothing,Gap,12M,Good,,Available,,,,${templateConsignorNumber}`
      : 'consignor_import_key,email,phone,item_import_key,item_description,price,category,brand,size,condition,item_notes,status,sale_price,sale_date,payout_status\\njane-smith-9055550100,jane@example.com,905-555-0100,jane-001,Blue winter coat,45.00,Clothing,Gap,Medium,Like new,,Available,,,';
"""
          new = """  const required = isConsignors
    ? 'consignor_import_key, first_name, last_name; item_description and price when the row contains an item'
    : fixedConsignor ? 'item_description, price' : 'consignor_import_key (or email/phone), item_description, price';
  const templateConsignorNumber = fixedConsignor?.number || 1;
  const itemColumns = 'item_import_key,item_description,price,category,item_type,brand,size,condition,item_notes,status,date_received,consignment_term,expiry_action,create_shopify_product,shopify_title,shopify_price,shopify_description,shopify_vendor,shopify_tags,publish_to_pos,publish_online,seo_title,seo_description,sale_price,sale_date,payout_status';
  const template = isConsignors
    ? `consignor_import_key,first_name,last_name,phone,email,address,city,province,postal_code,date_joined,commission_pct,unsold_preference,consignor_notes,${itemColumns}\\njane-smith-9055550100,Jane,Smith,905-555-0100,jane@example.com,123 Main Street,Hamilton,Ontario,L8E 1A1,2026-07-30,50,Please return,,jane-001,Blue winter coat,45.00,Clothing,Jacket,Gap,Medium,Like new,,Available,2026-07-30,90,Please return,true,Blue winter coat,45.00,Warm blue winter coat,Gap,winter|coat,true,true,Blue winter coat,Warm blue winter coat for sale,,,'
    : fixedConsignor
      ? `${itemColumns},consignor_number\\nitem-001,Blue baby sweater,18.00,Clothing,Sweater,Gap,12M,Good,,Available,2026-07-30,60,Please return,true,Blue baby sweater,18.00,Soft blue baby sweater,Gap,baby|sweater,true,false,Blue baby sweater,Soft blue baby sweater,,,${templateConsignorNumber}`
      : `consignor_import_key,email,phone,${itemColumns}\\njane-smith-9055550100,jane@example.com,905-555-0100,jane-001,Blue winter coat,45.00,Clothing,Jacket,Gap,Medium,Like new,,Available,2026-07-30,90,Please return,true,Blue winter coat,45.00,Warm blue winter coat,Gap,winter|coat,true,true,Blue winter coat,Warm blue winter coat for sale,,,';
"""
          text = replace_once(text, old, new, 'import templates')

          text = replace_once(
              text,
              "<div><span>Importing</span><strong style={{ fontSize: 13 }}>{isConsignors ? 'Consignors + manual items' : 'Items'}</strong></div>",
              "<div><span>Importing</span><strong style={{ fontSize: 13 }}>{isConsignors ? 'Consignors + items' : 'Items'} · Shopify rows supported</strong></div>",
              'import preview label',
          )
          path.write_text(text)

          # ---------------- Downloadable repo templates ----------------
          headers = 'consignor_import_key,first_name,last_name,phone,email,address,city,province,postal_code,date_joined,commission_pct,unsold_preference,consignor_notes,item_import_key,item_description,price,category,item_type,brand,size,condition,item_notes,status,date_received,consignment_term,expiry_action,create_shopify_product,shopify_title,shopify_price,shopify_description,shopify_vendor,shopify_tags,publish_to_pos,publish_online,seo_title,seo_description,sale_price,sale_date,payout_status'
          sample = 'jane-smith-9055550100,Jane,Smith,905-555-0100,jane@example.com,123 Main Street,Hamilton,Ontario,L8E 1A1,2026-07-30,50,Please return,,jane-001,Blue winter coat,45.00,Clothing,Jacket,Gap,Medium,Like new,,Available,2026-07-30,90,Please return,true,Blue winter coat,45.00,Warm blue winter coat,Gap,winter|coat,true,true,Blue winter coat,Warm blue winter coat for sale,,,'
          Path('consignors-and-items-import-template.csv').write_text(headers + '\n' + sample + '\n', encoding='utf-8-sig')

          filled = [
              sample,
              'jane-smith-9055550100,Jane,Smith,905-555-0100,jane@example.com,123 Main Street,Hamilton,Ontario,L8E 1A1,2026-07-30,50,Please return,,jane-002,Leather handbag,60.00,Handbags,Handbag,Coach,,Good,,Available,2026-07-30,120,Please return,true,Coach leather handbag,65.00,Pre-owned Coach leather handbag,Coach,coach|handbag,true,false,Coach leather handbag,Pre-owned Coach handbag,,,',
              'michael-brown-9055550101,Michael,Brown,905-555-0101,michael@example.com,45 King Street,Hamilton,Ontario,L8P 1A1,2026-08-01,50,Donate,Manual item example,michael-001,Vintage cookbook,20.00,Books,Book,, ,Good,,Available,2026-08-01,none,Donate,false,,,,,,false,false,,,,,',
          ]
          Path('consignors-and-items-import-template-filled.csv').write_text(headers + '\n' + '\n'.join(filled) + '\n', encoding='utf-8-sig')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified changes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-full-shopify-import.yml
          git add app/routes/api.consignment.jsx app/consignment_intake.jsx consignors-and-items-import-template.csv consignors-and-items-import-template-filled.csv
          git diff --cached --check
          git commit -m "Add Shopify product creation to CSV import"
          git push origin HEAD:main
