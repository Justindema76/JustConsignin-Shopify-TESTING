# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1efdac497e81fda096a36c177587b056"
name = "JATB Consignment Manager"
application_url = "https://shopify-consignment-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_inventory,read_locations,read_markets_home,read_metaobjects,read_orders,read_products,read_publications,write_files,write_inventory,write_metaobjects,write_products,write_publications"

[auth]
redirect_urls = [ "https://shopify-consignment-app.onrender.com/api/auth" ]

[pos]
embedded = true
